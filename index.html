<title>Hotel Deal Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --ground:#eef0f2; --surface:#fff; --surface-2:#f6f7f8; --line:#d8dce0; --line-soft:#e7eaed;
  --ink:#14181d; --ink-2:#4d555f; --ink-3:#79828d;
  --accent:#0f6470; --accent-soft:#dff0f1;
  --good:#1f6f4f; --good-soft:#dff0e7; --warn:#8a5d08; --warn-soft:#f8ecd2; --bad:#993029; --bad-soft:#f9e3e0;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1116; --surface:#161b22; --surface-2:#1c222b; --line:#2b333d; --line-soft:#232a33;
  --ink:#e8ebee; --ink-2:#a8b2bd; --ink-3:#7b858f;
  --accent:#4fb3bf; --accent-soft:#12303400;
  --good:#5cc292; --good-soft:#12291f; --warn:#d9a441; --warn-soft:#2a2216; --bad:#e08279; --bad-soft:#2c1a18;
}}
:root[data-theme="dark"]{
  --ground:#0e1116; --surface:#161b22; --surface-2:#1c222b; --line:#2b333d; --line-soft:#232a33;
  --ink:#e8ebee; --ink-2:#a8b2bd; --ink-3:#7b858f;
  --accent:#4fb3bf; --accent-soft:#123034;
  --good:#5cc292; --good-soft:#12291f; --warn:#d9a441; --warn-soft:#2a2216; --bad:#e08279; --bad-soft:#2c1a18;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
a{color:var(--accent)}
h1{font-family:var(--serif);font-size:23px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line);padding-block:14px 0}
.headrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:14px 0}
.tile{background:var(--surface);padding:11px 13px}
.tile .n{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-top:2px}
.tabs{display:flex;gap:2px;margin-bottom:-1px}
.tab{appearance:none;border:1px solid transparent;border-bottom:none;background:none;font:inherit;color:var(--ink-2);padding:8px 14px;border-radius:7px 7px 0 0;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.tab .c{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0 7px 7px 7px;padding:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:11px}
input,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input[type=search]{flex:1 1 220px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{color:var(--ink-3);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th[aria-sort] .ar{color:var(--accent)}
td{padding:8px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.nm{font-weight:500}
.loc{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.flat{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-soft)}
.sev{display:inline-block;width:3px;height:15px;border-radius:2px;vertical-align:-3px;margin-right:7px}
.reasons{color:var(--ink-2);font-size:12.5px}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:0;max-width:min(560px,92vw);width:100%}
dialog::backdrop{background:rgba(6,10,14,.55)}
.dh{padding:15px 17px 11px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--serif);font-size:17px;margin:0 0 3px;font-weight:600}
.db{padding:13px 17px 17px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.db dt{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.db dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;word-break:break-word}
.db dd.t{font-family:var(--sans)}
.dfoot{padding:0 17px 16px}
button.x{appearance:none;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font:inherit;padding:6px 13px;border-radius:6px;cursor:pointer}
footer{color:var(--ink-3);font-size:12px;margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:640px){
  th.opt,td.opt{display:none}
  h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="wrap">
<header class="top">

</header>

<div class="panel" id="panel" role="tabpanel">
  <div class="controls">
    <input type="search" id="q" placeholder="Search hotel, city, brand or broker" autocomplete="off">
    <select id="state"><option value="">All states</option></select>
    <select id="filter"><option value="">All rows</option></select>
    <span class="hint" id="hint"></span>
  </div>
  <div class="scroll"><table id="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <div class="empty" id="empty" hidden>Nothing matches those filters.</div>
</div>

<footer>
  <span id="foot"></span>
</footer>
</div>

<dialog id="detail">
  <div class="dh"><h2 id="d-name"></h2><div class="sub" id="d-loc"></div></div>
  <dl class="db" id="d-body"></dl>
  <div class="dfoot"><button class="x" id="d-close">Close</button></div>
</dialog>

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const { listings, distress, generated } = DATA;
  // The public build ships listings only; drop the parts of the page that would stand empty.
  const hasDistress = distress.length > 0;

  const money = n => n == null ? '' : '$' + Math.round(n).toLocaleString('en-US');
  const short = n => n == null ? '' : n >= 1e6 ? '$' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : money(n);
  const num = n => n == null ? '' : Math.round(n).toLocaleString('en-US');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SOURCES = { marcusmillichap: 'Marcus & Millichap', hotelsforsale: 'HotelsForSale', southeast: 'Southeast Intl',
    hotelbrokerone: 'HotelBrokerOne', leisure: 'Leisure REA', timm: 'Timm', lodgingbrokers: 'Lodging Brokers',
    avisonyoung: 'Avison Young', newmark: 'Newmark', hotelnewsresource: 'Announcement' };
  const srcLabel = s => (s || '').split(',').map(x => SOURCES[x] || x).join(', ');

  // How bad the loan looks, which drives the stripe and the ordering.
  const severity = d => {
    if (d.ss || (d.dscr != null && d.dscr < 1)) return 2;
    if ((d.value != null && d.loan != null && d.value < d.loan) || d.maturity) return 1;
    return 0;
  };
  const SEV_COLOR = ['var(--ink-3)', 'var(--warn)', 'var(--bad)'];

  const ltv = d => (d.value && d.loan) ? Math.round((d.value / d.loan) * 100) : null;

  const VIEWS = {
    sale: {
      rows: listings,
      filters: [['priced', 'Has an asking price'], ['under', 'Under contract'], ['big', '100+ rooms'], ['branded', 'Branded']],
      pass: (r, f) => f === 'priced' ? r.price != null : f === 'under' ? /under_contract/.test(r.status || '')
            : f === 'big' ? (r.rooms || 0) >= 100 : f === 'branded' ? !!r.brand : true,
      hay: r => [r.name, r.city, r.state, r.brand, r.broker, srcLabel(r.src)].join(' ').toLowerCase(),
      cols: [
        { k: 'name', h: 'Hotel', cell: r => `<span class="nm">${esc(r.name)}</span>${/under_contract/.test(r.status || '') ? ' <span class="chip warn">under contract</span>' : ''}` },
        { k: 'city', h: 'Where', cell: r => `<span class="loc">${esc(r.city || '—')}${r.state ? ', ' + esc(r.state) : ''}</span>`, sort: r => `${r.state || 'ZZ'}${r.city || ''}` },
        { k: 'rooms', h: 'Rooms', n: 1, cell: r => num(r.rooms) },
        { k: 'price', h: 'Asking', n: 1, cell: r => r.price ? short(r.price) : '<span class="chip flat">on request</span>' },
        { k: 'ppk', h: 'Per room', n: 1, cell: r => r.ppk ? money(r.ppk) : '' },
        { k: 'src', h: 'Source', cls: 'opt', cell: r => `<span class="loc">${esc(srcLabel(r.src))}</span>` },
      ],
      initial: 'price',
    },
    dist: {
      rows: distress,
      filters: [['ss', 'In special servicing'], ['dscr', 'Income below debt service'], ['under', 'Valued below the loan'], ['listed', 'Also for sale']],
      pass: (r, f) => f === 'ss' ? !!r.ss : f === 'dscr' ? (r.dscr != null && r.dscr < 1)
            : f === 'under' ? (r.value != null && r.loan != null && r.value < r.loan) : f === 'listed' ? !!r.pid : true,
      hay: r => [r.name, r.city, r.state, r.deal, r.reasons].join(' ').toLowerCase(),
      cols: [
        { k: 'name', h: 'Hotel', cell: r => `<span class="sev" style="background:${SEV_COLOR[severity(r)]}"></span><span class="nm">${esc(r.name || '—')}</span>${r.pid ? ' <span class="chip good">also for sale</span>' : ''}` },
        { k: 'city', h: 'Where', cell: r => `<span class="loc">${esc(r.city || '—')}${r.state ? ', ' + esc(r.state) : ''}</span>`, sort: r => `${r.state || 'ZZ'}${r.city || ''}` },
        { k: 'rooms', h: 'Rooms', n: 1, cell: r => num(r.rooms) },
        { k: 'dscr', h: 'DSCR', n: 1, cell: r => r.dscr == null ? '' : `<span class="chip ${r.dscr < 1 ? 'bad' : 'good'}">${r.dscr.toFixed(2)}x</span>` },
        { k: 'loan', h: 'Loan', n: 1, cell: r => short(r.loan) },
        { k: 'ltv', h: 'Value/loan', n: 1, cell: r => { const v = ltv(r); return v == null ? '' : `<span class="chip ${v < 100 ? (v < 70 ? 'bad' : 'warn') : 'flat'}">${v}%</span>`; }, sort: r => ltv(r) },
        { k: 'reasons', h: 'Why', cls: 'opt', cell: r => `<span class="reasons">${esc(r.reasons)}</span>` },
      ],
      initial: 'sev',
    },
  };

  let view = 'sale', sortKey = null, sortDir = 1;

  const el = id => document.getElementById(id);
  const stateSel = el('state'), filterSel = el('filter'), q = el('q');

  const stats = () => {
    const ppk = listings.map(l => l.ppk).filter(Boolean).sort((a, b) => a - b);
    el('t-sale').textContent = listings.length.toLocaleString();
    el('t-ppk').textContent = ppk.length ? money(ppk[ppk.length >> 1]) : '—';
    el('t-states').textContent = new Set(listings.map(l => l.state).filter(Boolean)).size;
    el('c-sale').textContent = listings.length;
    if (hasDistress) {
      el('t-dist').textContent = distress.length.toLocaleString();
      el('t-ss').textContent = distress.filter(d => d.ss).length.toLocaleString();
      el('t-both').textContent = distress.filter(d => d.pid).length;
      el('c-dist').textContent = distress.length.toLocaleString();
    } else {
      for (const id of ['tile-dist', 'tile-ss', 'tile-both']) el(id).hidden = true;
      for (const id of ['tile-rooms', 'tile-priced']) el(id).hidden = false;
      el('tab-dist').hidden = true;
      el('tab-sale').style.borderRadius = '7px 7px 0 0';
      el('t-rooms').textContent = listings.reduce((n, l) => n + (l.rooms || 0), 0).toLocaleString();
      el('t-priced').textContent = listings.filter(l => l.price).length;
    }
    const when = new Date(generated);
    const subject = hasDistress ? 'US hotels for sale, and hotels whose loan is in trouble' : 'Every US hotel our daily sweep of the brokerage sites found for sale';
    el('asof').textContent = `${subject} · collected ${when.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
    el('foot').textContent = hasDistress
      ? 'Listings from ten broker sites, refreshed daily. Distress from SEC asset-level filings (public CMBS only — 144A deals are exempt), refreshed weekly. Loan codes are shown as filed; nothing here is inferred.'
      : 'Collected daily from ten hotel brokerage sites. Each row links back to the broker\u2019s own listing, which is where price and availability are confirmed.';
  };

  const rebuildFilters = () => {
    const v = VIEWS[view];
    const states = [...new Set(v.rows.map(r => r.state).filter(Boolean))].sort();
    stateSel.innerHTML = '<option value="">All states</option>' + states.map(s => `<option>${s}</option>`).join('');
    filterSel.innerHTML = '<option value="">All rows</option>' + v.filters.map(([k, label]) => `<option value="${k}">${label}</option>`).join('');
  };

  const current = () => {
    const v = VIEWS[view];
    const term = q.value.trim().toLowerCase();
    const st = stateSel.value, f = filterSel.value;
    let rows = v.rows.filter(r => (!st || r.state === st) && (!f || v.pass(r, f)) && (!term || v.hay(r).includes(term)));
    const col = v.cols.find(c => c.k === sortKey);
    if (col) {
      const get = col.sort || (r => r[col.k]);
      rows = [...rows].sort((a, b) => {
        const x = get(a), y = get(b);
        if (x == null && y == null) return 0;
        if (x == null) return 1;
        if (y == null) return -1;
        return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * sortDir;
      });
    } else if (view === 'dist') {
      rows = [...rows].sort((a, b) => severity(b) - severity(a) || (a.dscr ?? 9) - (b.dscr ?? 9));
    } else {
      rows = [...rows].sort((a, b) => (b.price ?? -1) - (a.price ?? -1));
    }
    return rows;
  };

  const render = () => {
    const v = VIEWS[view], rows = current();
    el('thead').innerHTML = '<tr>' + v.cols.map(c =>
      `<th data-k="${c.k}" class="${c.cls || ''}${c.n ? ' num' : ''}"${sortKey === c.k ? ` aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${c.h}${sortKey === c.k ? `<span class="ar"> ${sortDir > 0 ? '↑' : '↓'}</span>` : ''}</th>`).join('') + '</tr>';
    el('tbody').innerHTML = rows.slice(0, 400).map((r, i) =>
      `<tr tabindex="0" data-i="${v.rows.indexOf(r)}">` + v.cols.map(c => `<td class="${c.cls || ''}${c.n ? ' num' : ''}">${c.cell(r)}</td>`).join('') + '</tr>').join('');
    el('empty').hidden = rows.length > 0;
    el('hint').textContent = rows.length > 400 ? `showing 400 of ${rows.length.toLocaleString()}` : `${rows.length.toLocaleString()} of ${v.rows.length.toLocaleString()}`;
  };

  const rowFields = r => view === 'sale'
    ? [['Where', `${r.city || '—'}${r.state ? ', ' + r.state : ''}`, 1], ['Brand', r.brand, 1], ['Rooms', num(r.rooms)],
       ['Built', r.year], ['Asking price', r.price ? money(r.price) : 'not published'], ['Per room', r.ppk ? money(r.ppk) : ''],
       ['Cap rate', r.cap ? r.cap + '%' : ''], ['Broker', r.broker, 1], ['Source', srcLabel(r.src), 1],
       ['First seen', r.seen ? r.seen.slice(0, 10) : ''], ['Listing', r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">open ↗</a>` : '', 1]]
    : [['Where', `${r.city || '—'}${r.state ? ', ' + r.state : ''}`, 1], ['Rooms', num(r.rooms)], ['Built', r.year],
       ['Why flagged', r.reasons, 1], ['DSCR', r.dscr != null ? r.dscr.toFixed(2) + 'x' : ''],
       ['Net operating income', money(r.noi)], ['Occupancy', r.occupancy != null ? r.occupancy + '%' : ''],
       ['Loan balance', money(r.loan)], ['Appraised value', money(r.value)], ['Value / loan', ltv(r) != null ? ltv(r) + '%' : ''],
       ['Maturity', r.maturity], ['Special servicing since', r.ss], ['CMBS deal', r.deal, 1], ['Filing as of', r.as_of]];

  const openRow = i => {
    const r = VIEWS[view].rows[i];
    el('d-name').textContent = r.name || 'Unnamed hotel';
    el('d-loc').textContent = view === 'sale' ? 'For sale' : 'Loan in trouble' + (r.pid ? ' · also listed for sale' : '');
    el('d-body').innerHTML = rowFields(r).filter(([, v]) => v !== '' && v != null)
      .map(([k, v, text]) => `<dt>${k}</dt><dd class="${text ? 't' : ''}">${text ? v : esc(v)}</dd>`).join('');
    el('detail').showModal();
  };

  el('thead').addEventListener('click', e => {
    const th = e.target.closest('th'); if (!th) return;
    const k = th.dataset.k;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'name' || k === 'city' ? 1 : -1; }
    render();
  });
  el('tbody').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) openRow(+tr.dataset.i); });
  el('tbody').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('tr')) openRow(+e.target.closest('tr').dataset.i); });
  el('d-close').addEventListener('click', () => el('detail').close());
  [q, stateSel, filterSel].forEach(c => c.addEventListener('input', render));
  ['sale', 'dist'].forEach(v => el('tab-' + v).addEventListener('click', () => {
    view = v; sortKey = null;
    el('tab-sale').setAttribute('aria-selected', String(v === 'sale'));
    el('tab-dist').setAttribute('aria-selected', String(v === 'dist'));
    q.value = ''; rebuildFilters(); render();
  }));

  stats(); rebuildFilters(); render();
})();
</script>
